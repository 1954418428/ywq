<!DOCTYPE html>
<html>
<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="format-detection" content="telephone=no,address=no" />
  <title>人物展示</title>
  <style>
    /* H5 专属外壳样式：移动端全屏，大屏（桌面/大屏浏览器）下限宽居中 */
    html,
    body {
      margin: 0;
      padding: 0;
      background: #e8ebf1;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      margin: 0 auto;
      min-height: 100vh;
      background: #f5f6f8;
      box-shadow: 0 0 32px rgba(31, 41, 61, 0.08);
    }
    /* Taro 内置导航栏：标题与返回键缩小 */
    #taro-navigation-bar .taro-navigation-bar-title {
      font-size: 32px;
    }
    #taro-navigation-bar.taro-navigation-bar-back-icon > .taro-navigation-bar-back,
    #taro-navigation-bar.taro-navigation-bar-home-icon > .taro-navigation-bar-home {
      width: 32px;
      height: 32px;
    }
    #taro-navigation-bar .taro-navigation-bar-back svg,
    #taro-navigation-bar .taro-navigation-bar-home svg {
      width: 32px;
      height: 32px;
    }
    /* Taro Video（H5）：视频根元素自带 taro-video-container 类（position:absolute，脱离文档流），
       组件自带的 taro-video 包裹层规则（position:relative）匹配不到任何元素，
       需在此拉回文档流，否则视频悬浮、遮挡下方内容且 .video-item 高度塌陷 */
    .detail-scroll .video-player {
      display: block;
      position: relative;
    }
  </style>
  <script>
    document.write(
      '<link rel="icon" href="data:image/ico,ico" type="image/x-icon" />'
    )
  </script>
</head>
<body>
  <div id="app"></div>
  <script><%= htmlWebpackPlugin.options.script %></script>
</body>
</html>
